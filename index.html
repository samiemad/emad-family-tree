ا عميق» (في الأربعينيات والخمسينيات من القرن 19)؛ وفي حرب 1860 أرسل سعيد بك جنبلاط «الشيخ كنجاً العمادي يقود شرذمة من رجاله» إلى حاصبيا؛ وبعد نزول الفرنسيين ذهب «الشيخ كنج العماد» مع خطار بك وملحم بك إلى حوران. — يوسف خطار أبو شقرا، «الحركات في لبنان إلى عهد المتصرفية»، ص 73–74، 119، 134 فإن كان هو كنج بن ناصر الدين (والشجرة لا تعرف كنجاً غيره) فهو حيّ نشيط سنة 1860، وهذا لا يوافق سنتي 1769 و1837 اللتين في الشجرة، ويوافق كونه ابن ناصر الدين الذي قُتل سنة 1838 وأبا مصطفى الذي كان بكباشياً سنة 1899. ","url":"/emad-family-tree/people/kanj-nasraldin/"},"id":"kanj-nasraldin","rels":{"children":["ahmad-kanj","fayiz-kanj"],"parents":["nasraldin-abualnasr"],"spouses":[]}},{"data":{"born":"1936","died":"","gender":"M","name":"كنج","order":5,"photo":"","place":"","summary":"","url":"/emad-family-tree/people/kanj-sulayman/"},"id":"kanj-sulayman","rels":{"children":["basil-kanj","bashar-kanj","wasim-kanj"],"parents":["sulayman-shahin"],"spouses":[]}},{"data":{"born":"","died":"","gender":"M","name":"لؤي","order":1,"photo":"","place":"","summary":"","url":"/emad-family-tree/people/luay-marwan/"},"id":"luay-marwan","rels":{"children":[],"parents":["marwan-sabir"],"spouses":[]}},{"data":{"born":"","died":"","gender":"M","name":"لؤي","order":1,"photo":"","place":"","summary":"","url":"/emad-family-tree/people/luay-faysal/"},"id":"luay-faysal","rels":{"children":[],"parents":["faysal"],"spouses":[]}},{"data":{"born":"","died":"","gender":"M","name":"لؤي","order":5,"photo":"","place":"","summary":"","url":"/emad-family-tree/people/luay-salman/"},"id":"luay-salman","rels":{"children":["sami-luay"],"parents":["salman-hammoud"],"spouses":[]}},{"data":{"born":"","died":"","gender":"M","name":"ليث","order":1,"photo":"","place":"","summary":"","url":"/emad-family-tree/people/layth/"},"id":"layth","rels":{"children":[],"parents":["faris-salama"],"spouses":[]}},{"data":{"born":"","died":"","gender":"M","name":"ليث","order":1,"photo":"","place":"","summary":"","url":"/emad-family-tree/people/ قُتل بطلاً في وادي بكّا سنة 1838 في ثورة الدروز على إبراهيم باشا ولم ينجُ من رجاله إلا نحو خمسين. وتؤكد مجلة الضحى أنه هو ابن أبي النصر (انظر أدناه)، ولذلك فسنة 1769 لولادة ابنه كنج موضع شك. — الشدياق، «أخبار الأعيان»، صورة 85؛ الشدياق، «أخبار الأعيان»، صورة 86 أخبار «الشيخ ناصر الدين العماد» عند الشدياق: في جبيل سنة 1807 هجم على باب دار عبد الأحد باز في الحملة على آل باز؛ وفي سنة 1825 بقي في كفرنبرخ محافظاً فأبقى الأمير بشير عسكراً في بتدين «خوفاً من الشيخ ناصر الدين»؛ وفي ثورة 1838 جاء إلى الأمير بشير فأعطاه صلة ثم سار إلى شبلي العريان وقُتل في وادي بكّا. ويقول في وصف الباروك: «ومنها ناصر الدين الدرزي الذي قُتل في وقعة وادي بكّا وكان أشجع رجال عصره». — الشدياق، «أخبار الأعيان»، صورة 199؛ الشدياق، «أخبار الأعيان»، صورة 222؛ الشدياق، «أخبار الأعيان»، صورة 232؛ الشدياق، «أخبار الأعيان»، صورة 17 تسمّيه مجلة الضحى «ناصر الدين بن أبو النصر بن بشير بن عماد بن سيد أحمد عماد» وتقول: «وُلد في الباروك، كان بطلاً مغواراً شجاعاً مقداماً قال عنه الشدياق أشجع أهل زمانه»، وتذكر أنه أُصيب في يده في جبيل سنة 1807 حين قُتل عبد الأحد باز، وأنه قاتل مع مصطفى باشا وكان من موالي الشيخ بشير جنبلاط ضد الأمير بشير، ورجع إلى الباروك سنة 1831 بعد أن وافق الأمير على رجوع النازحين من آل عماد. — مجلة الضحى، «الباروك» (2016) يقول أبو شقرا إن دروز الشوف ووادي التيم ثاروا على إبراهيم باشا (1838) بعسكر «يقوده الشيخان حسين علي جنبلاط وناصر الدين عماد وشبلي آغا العريان»، وكانت بينهم وبين إبراهيم باشا وقائع في عين جنعم ووادي بكّا. وفي «وقعة عين جنعم» التقى «الزعماء الثلاثة أي حسين جنبلاط وناصر الدين عماد وشبلي العريان» بعسكر الأمير خليل ابن الأمير بشير فهزموه. — يوسف خطار أبو شقرا، «الحركات في لبنان إلى عهد المتصرفية»، ص 18–20 ","url":"/emad-family-tree/people/nasraldin-abualnasr/"},"id":"nasraldin-abualnasr","rels":{"children":["bashir-nasraldin","kanj-nasraldin"],"parents":["abualnasr"],"spouses":[]}},{"data":{"born":"","died":"","gender":"M","name":"نصرالدين","order":1,"photo":"","place":"","summary":"","url":"/emad-family-tree/people/nasraldin-baayzaq/"},"id":"nasraldin-baayzaq","rels":{"children"
